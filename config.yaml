# =====================================================================
# Emergency Department Triage Pipeline Configuration
# =====================================================================

# Global random seed for reproducibility
seed: 42

# Data Ingestion Settings
data:
  raw_path: "data/yaleemmlc_admissionprediction_triage.csv"
  target: "esi"

# Model Selection & Hyperparameters
model:
  model_type: "random_forest"  # Options: "random_forest", "logistic_regression", "gradient_boosting"
  hyperparameters:
    n_estimators: 200
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

# Output Directories for Governance & Handover
paths:
  figures: "figs"
  models: "models"
  reports: "reports"
